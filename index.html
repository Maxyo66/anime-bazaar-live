<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anime Bazaar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
<style>
/* Lantern-lit night bazaar: wood + brass counters, velvet tent, metallic tier frames */
:root{
  --text:#fff4dc; --muted:#d8c3a0; --accent:#ffb43b; --good:#5ee37f; --bad:#ff6464; --shield:#9cd2ff; --burn:#ff8a3d; --poison:#8be36b;
  --brass:#d9a44a; --brass2:#7a531c; --wood1:#4a2c1a; --wood2:#5a3722; --wood3:#3b2214; --ink:#120a12;
  --u:min(84px, calc((100vw - 32px) / 10));
  color-scheme:dark;
}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;color:var(--text);font-family:Nunito,system-ui,sans-serif;min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%,#ff9a3c33 0,transparent 22%),radial-gradient(circle at 88% 14%,#ff7a3c2e 0,transparent 20%),
    radial-gradient(ellipse at 50% -10%,#6b2f5e 0,transparent 55%),
    repeating-linear-gradient(100deg,#ffffff05 0 2px,transparent 2px 9px),
    linear-gradient(180deg,#2a1530 0%,#1a0f1f 45%,var(--ink) 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:calc(26px + env(safe-area-inset-top, 0px));z-index:1;pointer-events:none;
  background:repeating-linear-gradient(90deg,#b8322b 0 34px,#e9c46a 34px 68px);
  -webkit-mask:radial-gradient(circle at 17px 100%,transparent 16px,#000 17px) 0 100%/34px 100% repeat-x;mask:radial-gradient(circle at 17px 100%,transparent 16px,#000 17px) 0 100%/34px 100% repeat-x;filter:drop-shadow(0 3px 3px #0008)}
body.sandstorm{box-shadow:inset 0 0 120px #d9963a88}
button{font-family:inherit;cursor:pointer;border-radius:10px;padding:10px 16px;font-weight:900;font-size:14px;color:var(--text);
  background:linear-gradient(#5a3a26,#3a2316);border:2px solid var(--brass2);box-shadow:inset 0 1px 0 #ffffff22,0 3px 0 #1a0d06;text-shadow:0 1px 2px #000}
button:hover:not(:disabled){filter:brightness(1.2)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff22,0 1px 0 #1a0d06}
button:focus-visible,.card:focus-visible,.hero:focus-visible{outline:3px solid #fff0b8;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(#ffd77a,#e09a28 55%,#b46d14);border-color:#fff0b8;color:#3a1d05;text-shadow:0 1px 0 #ffe9b0}
button.iconbtn{padding:4px 9px;font-size:15px;border-radius:20px}
h1,h2,h3{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-weight:400;margin:0;text-shadow:0 2px 0 #000,0 0 12px #0008;text-wrap:balance}
.wrap{max-width:920px;margin:0 auto;padding-block:calc(34px + env(safe-area-inset-top, 0px)) 90px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));position:relative}
.title{font-size:clamp(52px,11vw,104px);text-align:center;background:linear-gradient(180deg,#fff3b0,#ffc040 45%,#e0701c 70%,#a43a10);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #3a1405;filter:drop-shadow(0 4px 0 #1a0805) drop-shadow(0 0 24px #ff8a3d88);margin-top:10px;text-shadow:none}
.sub{text-align:center;color:var(--muted);margin:4px 0 16px;font-weight:700}
.wood{background:linear-gradient(#00000055,#00000077),repeating-linear-gradient(92deg,var(--wood1) 0 6px,var(--wood2) 6px 11px,var(--wood3) 11px 19px,var(--wood2) 19px 23px);
  border:2px solid var(--brass);border-radius:14px;box-shadow:inset 0 0 0 2px #1d0f07,inset 0 0 30px #000a,0 8px 20px #000a}
.velvet{background:radial-gradient(ellipse at 50% 0,#ffb24a22,transparent 60%),repeating-linear-gradient(90deg,#3b1530 0 26px,#331229 26px 52px);
  border:2px solid var(--brass);border-radius:16px;box-shadow:inset 0 0 0 2px #1d0812,inset 0 0 40px #000c,0 8px 20px #000a}
.menu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.daily{padding:12px 16px;margin:0 auto 18px;max-width:640px;text-align:center}
.daily b{color:#ffd77a}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.hero{position:relative;border-radius:16px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s;overflow:hidden;color:var(--text);font:inherit;
  background:radial-gradient(circle at 50% 22%,color-mix(in srgb,var(--hc) 70%,transparent),transparent 62%),linear-gradient(#2a1a26,#160d14);
  border:0;box-shadow:0 0 0 2px var(--brass),0 10px 20px #000a;text-align:center}
.hero:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 0 0 3px #ffe08a,0 0 28px color-mix(in srgb,var(--hc) 70%,transparent),0 14px 24px #000c}
.hero .avatar{margin:6px auto 0;width:88px;height:88px}
.hero .avatar .em{font-size:44px}
.hero h3{font-size:24px;margin-top:14px}
.hero .rec{position:absolute;top:8px;right:10px;font-size:12px;font-weight:900;color:#ffd77a}
.hero .new{position:absolute;top:8px;left:10px;font-size:10px;font-weight:900;letter-spacing:1px;background:#ff5f6d;color:#fff;border-radius:6px;padding:1px 6px}
.avatar{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--hc) 60%,#fff),var(--hc) 45%,color-mix(in srgb,var(--hc) 45%,#000));
  box-shadow:0 0 0 3px #2a1406,0 0 0 6px var(--brass),0 0 0 8px #2a1406,0 4px 12px #000c}
.duo-avatar .duo-face{position:absolute;width:73%;height:73%;overflow:hidden;border-radius:50%;border:2px solid #25121b;background:#25121b}.duo-avatar .duo-face:first-child{left:-3%;top:-3%}.duo-avatar .duo-face:last-child{right:-3%;bottom:-3%}
.avatar .em{font-size:28px;filter:drop-shadow(0 2px 2px #0009)}
.avatar .ini{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-family:Bangers;font-size:12px;letter-spacing:1px;background:#2a1406;color:#ffd77a;border:1px solid var(--brass);border-radius:6px;padding:0 5px;line-height:1.4}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.small{font-size:12px;color:var(--muted)}
.howto{padding:14px 18px;margin-top:20px;font-size:14px;color:var(--muted);line-height:1.5}
.howto b{color:#ffd77a}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;margin-bottom:14px}
.top .avatar{width:46px;height:46px}
.top .who{flex:1;min-width:130px}
.stat{background:linear-gradient(#2a1406,#1a0c04);border:1px solid var(--brass);border-radius:20px;padding:4px 10px;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:inset 0 1px 0 #ffffff1a;font-variant-numeric:tabular-nums}
.xpbar{height:5px;border-radius:3px;background:#0008;margin-top:4px;overflow:hidden;max-width:160px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd77a,#ff9a3c)}
.stage{padding:16px;margin-bottom:14px;min-height:170px}
.stage h2{font-size:32px;margin-bottom:10px;color:#ffe3a3}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.choice{position:relative;border-radius:14px;padding:16px 12px 14px;cursor:pointer;text-align:center;color:var(--text);overflow:hidden;font:inherit;
  background:radial-gradient(circle at 50% 28%,var(--cg,#7a4cff55),transparent 60%),linear-gradient(#2d1a2a,#170c15);
  border:2px solid var(--brass);box-shadow:inset 0 0 0 2px #1d0812,0 6px 14px #000a;transition:transform .12s}
.choice:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 2px #1d0812,0 0 22px var(--cg,#7a4cff88)}
.choice.shop{--cg:#2fc7a655}.choice.event{--cg:#a35cff66}.choice.mon{--cg:#ff4a4a55}.choice.elite{--cg:#ffc23a77;border-color:#ffe08a}
.choice.boss{--cg:#ff2a5a88;border-color:#ff7a9a;animation:bossglow 1.6s ease-in-out infinite alternate}
@keyframes bossglow{to{box-shadow:inset 0 0 0 2px #1d0812,0 0 26px #ff2a5a99}}
.choice .big{font-size:46px;filter:drop-shadow(0 4px 4px #000a)}
.choice h3{font-size:22px;margin-top:4px}
.choice .kind{display:inline-block;font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;background:#0008;border:1px solid var(--brass2);border-radius:6px;padding:1px 6px;margin-bottom:6px;color:#ffd77a}
.elite{color:#ffd23f}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
/* cards */
.card{position:relative;width:calc(var(--u,84px) * var(--s,1) - 4px);height:calc(var(--u,84px) * 1.45);margin:2px;border-radius:10px;padding:3px;flex:none;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:var(--frame);box-shadow:0 4px 8px #000b,inset 0 0 0 1px #0006;transition:transform .12s,box-shadow .12s}
.card[data-drag]{touch-action:none}
.row>.card,.stash>.card{min-width:calc(var(--u,84px) * var(--s,1) - 4px);min-height:calc(var(--u,84px) * 1.45)}
.card .in{position:absolute;inset:3px;border-radius:7px;overflow:hidden;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--hc) 85%,#fff) 0,var(--hc) 22%,color-mix(in srgb,var(--hc) 40%,#140a12) 62%,#0e070c 100%);
  box-shadow:inset 0 0 12px #000c,inset 0 0 0 1px #0008}
.card .in::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 38%,#ffffff10 0 8deg,transparent 8deg 22deg);mix-blend-mode:overlay}
.card .in::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff38 0,transparent 30%)}
.card .ic{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:calc(var(--u,84px) * .5);line-height:1;filter:drop-shadow(0 3px 3px #000b) drop-shadow(0 0 8px #fff6);z-index:2}
.card .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.card .in:has(.art) .ic{visibility:hidden}
.lab-stage{position:sticky;top:10px;z-index:20;display:flex;justify-content:space-around;align-items:center;min-height:220px;margin:24px auto 12px;border-radius:16px}.lab-stage>div{display:grid;justify-items:center;gap:14px}.lab-stage .avatar{width:92px;height:92px}.lab-now{text-align:center;min-height:2em;color:#ffde9b}.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.lab-grid button{display:grid;justify-items:center;align-content:start;padding:20px;gap:8px;text-align:center}.lab-grid h3,.lab-grid p{margin:0}.lab-grid h3{font-size:27px}@media(prefers-reduced-motion:reduce){.lab-stage *{animation:none!important}}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:10px 3px 3px;font-size:clamp(8px,calc(var(--u,84px) * .14),12px);font-weight:900;text-align:center;line-height:1.05;z-index:4;
  color:#ffe9b8;text-shadow:0 1px 2px #000,0 0 3px #000;background:linear-gradient(transparent,#000c 45%)}
.card .cdl{position:absolute;top:3px;left:3px;min-width:22px;height:18px;padding:0 4px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;z-index:5;background:#000b;border:1px solid #fff5}
.card .en{position:absolute;top:2px;right:3px;font-size:clamp(10px,calc(var(--u,84px) * .17),15px);z-index:5;filter:drop-shadow(0 0 4px #fff)}
.card .gem{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--gem);border:1px solid #000a;z-index:6;box-shadow:0 0 6px var(--gem)}
.card .price{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#3a1d05;z-index:7;white-space:nowrap;
  background:linear-gradient(#ffe48a,#e0a028);border:1px solid #fff0b8;border-radius:10px;padding:0 7px;box-shadow:0 2px 4px #000a}
.card .fusehint{position:absolute;top:22px;right:3px;font-size:12px;z-index:6;animation:pulse .8s infinite alternate}
.card .cdf{position:absolute;left:0;right:0;top:0;height:0;background:#000000b0;z-index:3;border-bottom:2px solid #ffffffaa}
.card.idle .cdf{border:0}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px #fff,0 0 18px #ffe08a,0 8px 12px #000b}
.card.sold{opacity:.25;pointer-events:none;filter:grayscale(1)}
.card:hover{transform:translateY(-3px)}
.card.fire{transform:translateY(-10px) scale(1.07);box-shadow:0 0 22px var(--gem),0 0 6px #fff}
.card.fire .in{filter:brightness(1.5)}
.card.frozen .in::after{background:linear-gradient(160deg,#d8f3ffaa,#6fc3ff88)}
.card.hasted{box-shadow:0 0 0 2px var(--good),0 0 14px var(--good)}
.card.slowed{box-shadow:0 0 0 2px #b07cff,0 0 14px #b07cff}
.card.dragging{opacity:.25}
.card.ghost{position:fixed;pointer-events:none;z-index:300;margin:0;transform:rotate(-4deg) scale(1.08);box-shadow:0 18px 30px #000c,0 0 20px var(--gem);transition:none}
.t0{--frame:linear-gradient(135deg,#f6c99a,#8a5228 35%,#e0a76a 55%,#5e3416 80%,#c08050);--gem:#e08a4b;--tc:#e8a368}
.t1{--frame:linear-gradient(135deg,#ffffff,#8e98a6 35%,#eef2f6 55%,#5d6672 80%,#c9d1da);--gem:#dfe7f0;--tc:#d6dee8}
.t2{--frame:linear-gradient(135deg,#fff6bf,#b8860b 35%,#ffe066 55%,#7a5200 80%,#f5c542);--gem:#ffd23f;--tc:#ffd23f}
.t3{--frame:linear-gradient(135deg,#f0feff,#3fb6d8 30%,#c8f6ff 50%,#7a5cff 75%,#9ef0ff);--gem:#8ff3ff;--tc:#8ff3ff}
.t4{--frame:linear-gradient(135deg,#fff0f7,#ff9ad2 18%,#c9a2ff 38%,#9fdcff 58%,#ffe9a0 78%,#fff0f7);--gem:#fff;--tc:#ff9ff3}
@keyframes spin{to{--spin:360deg}}
.card.t3{box-shadow:0 0 14px #8ff3ff88,0 4px 8px #000b}
.card.t4{box-shadow:0 0 18px #ff9ff399,0 4px 8px #000b}
@media (max-width:640px){.card.s1 .nm{display:none}.card.s1 .ic{top:22%}.card .cdl{font-size:9px;height:15px;min-width:18px}}
.board{width:calc(var(--u,84px) * 10 + 14px);max-width:100%;min-height:calc(var(--u,84px) * 1.45 + 18px);display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-flow:column dense;align-items:center;padding:5px;margin:0 auto;border-radius:14px;position:relative;
  background:repeating-linear-gradient(90deg,transparent 0 calc(var(--u,84px) - 1px),#d9a44a33 calc(var(--u,84px) - 1px) var(--u,84px)) 5px 0/calc(100% - 10px) 100% no-repeat,
    linear-gradient(#00000066,#00000088),repeating-linear-gradient(90deg,var(--wood1) 0 6px,var(--wood2) 6px 11px,var(--wood3) 11px 19px);
  border:2px solid var(--brass);box-shadow:inset 0 0 0 2px #1d0f07,inset 0 6px 18px #000c,0 6px 14px #000a}
.stash{display:flex;flex-wrap:wrap;align-items:center;min-height:calc(var(--u,84px) * 1.45 + 14px);padding:5px;border-radius:14px;background:#0d070bcc;border:2px dashed var(--brass2)}
body.is-dragging [data-drop]{outline:2px dashed #ffe08a55;outline-offset:2px}
[data-drop].dropok{outline:3px solid #ffe08a!important;box-shadow:0 0 24px #ffe08a88}
#insmark{position:fixed;width:4px;border-radius:10px;background:#ffe08a;box-shadow:0 0 10px #ffe08a;z-index:250;pointer-events:none;display:none}
#insmark.slotmark{background:#ffe08a22;border:3px dashed #ffe08a;box-shadow:0 0 16px #ffe08a88}
#insmark.swap{border-color:#7fd0ff;background:#7fd0ff22;box-shadow:0 0 16px #7fd0ff88}
#sellzone{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:none;z-index:240;width:min(560px,calc(100vw - 32px));padding:30px 20px;text-align:center;border-radius:20px;font-family:Bangers;font-size:34px;letter-spacing:1.5px;
  background:linear-gradient(#3a1406,#1d0904);border:3px dashed #ffb43b;color:#ffd77a;box-shadow:0 8px 20px #000c}
body.drag-inv #sellzone{display:block}
#sellzone.dropok{background:linear-gradient(#6a2a0aee,#3a1406ee);transform:none!important;box-shadow:0 0 30px #ffb43b,inset 0 0 40px #ffb43b55}
body.drag-inv #sellzone{display:grid!important;place-items:center;padding:10px;background:linear-gradient(#3a1406e6,#1d0904e6);backdrop-filter:blur(2px)}
#sellzone .sz-big{font-size:clamp(28px,4vw,46px)}#sellzone .sz-sub{font-family:Nunito,sans-serif;font-size:15px;font-weight:800;letter-spacing:0;margin-top:4px;color:#ffe9b8}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;font-family:Bangers;letter-spacing:1px;font-size:17px;color:#ffd77a;text-shadow:0 2px 0 #000}
.lbl .small{font-family:Nunito;letter-spacing:0;font-weight:700}
.detail{padding:14px;margin-top:14px;min-height:90px}
.detail .hd{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.detail .hd>div:last-child{min-width:0;flex:1}
.detail .hd .card{--u:84px}
.detail h3{font-size:28px;color:#ffe3a3}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:11px;background:#0008;border:1px solid var(--brass2);border-radius:6px;padding:2px 7px;font-weight:900;color:#ffd77a}
.fx{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.fx b{color:#ffd77a}
.fusion{margin-top:8px;font-size:13px;background:#0006;border:1px solid #c471f5;border-radius:10px;padding:6px 10px}
.tiername{font-weight:900;color:var(--tc)}
.modal{position:fixed;inset:0;background:radial-gradient(circle,#2a1406cc,#000e);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal .box{max-width:680px;width:100%;padding:20px}
.ultbox{text-align:center}
.ultbox .card{--u:100px;margin:14px auto}
/* combat */
.cside{padding:12px;position:relative;--u:min(80px,calc((100vw - 76px) / 10))}
.chead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.chead .avatar{width:54px;height:54px}
.hpwrap{flex:1;min-width:0}
.hpbar{height:24px;background:#1a0606;border-radius:12px;overflow:hidden;position:relative;border:2px solid var(--brass);box-shadow:inset 0 3px 6px #000c}
.hpbar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(#8dff9e,#2fbf4f 50%,#178a32);transition:width .12s}
.enemy .hpbar .fill{background:linear-gradient(#ff9a8d,#e0362f 50%,#9a1a16)}
.hpbar .sh{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#bfe3ffcc 0 6px,#8cc8ffcc 6px 12px);border-right:2px solid #fff}
.hpbar .txt{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;text-shadow:0 1px 2px #000,0 0 3px #000;font-variant-numeric:tabular-nums}
.status{display:flex;gap:6px;font-size:12px;font-weight:900;margin-top:5px;min-height:20px}
.status span{background:#000a;border:1px solid #fff3;border-radius:10px;padding:1px 8px}
.cmid{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.cmid .clock{font-family:Bangers;font-size:30px;min-width:100px;text-align:center;color:#ffe3a3;text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
.storm{color:#ffb84a!important;animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.6)}}
.pops{position:absolute;right:20px;top:4px;pointer-events:none;z-index:20}
.pop{position:absolute;right:0;font-family:Bangers;letter-spacing:1px;font-size:26px;white-space:nowrap;animation:up 1s ease-out forwards;-webkit-text-stroke:1.5px #000;paint-order:stroke fill}
.pop.hit{color:#ff5a5a}.pop.crit{color:#ffd23f;font-size:36px}.pop.heal{color:var(--good)}.pop.sh{color:var(--shield)}.pop.burn{color:var(--burn)}.pop.poison{color:var(--poison)}
@keyframes up{0%{transform:translateY(12px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.25);opacity:1}100%{transform:translateY(-44px) scale(1);opacity:0}}
.shake{animation:shake .25s}

.runwrap .choice .small{font-size:13px}
.runwrap .lbl{font-size:17px}
/* floating item details */
body.nopanel .card.sel{transform:none;box-shadow:0 4px 8px #000b}
#insmark.fuse{border-color:#c471f5;background:#c471f522;box-shadow:0 0 18px #c471f5aa}
.detail.floating{padding:0;background:none;border:0;box-shadow:none;overflow:visible;width:min(330px,calc(100vw - 24px))!important;max-height:none}
.detail.floating .tt-in{box-shadow:0 14px 34px #000d,0 0 0 1px #000}
.detail.floating .tt-in>:last-child{border-radius:0}
.detail.floating .dextra,.detail.floating .btns{background:#160d14;margin:0;padding:6px 10px;border-left:3px solid #0000;border-right:3px solid #0000}
.detail.floating .dextra .fusion{margin:4px 0;font-size:12.5px}
.detail.floating>.btns{border-radius:0 0 12px 12px;padding:8px 10px 10px;display:flex;flex-wrap:wrap;gap:6px;box-shadow:0 14px 34px #000d}
.detail.floating>.btns button{padding:7px 12px;font-size:13px;flex:1 1 auto}
.detail.floating .dclose{position:absolute;top:-10px;right:-10px;z-index:2;padding:2px 8px;font-size:13px}
.detail.floating .tth{padding-right:12px}
/* combat log dropdown */
details.logwrap{padding:6px 12px}
details.logwrap summary{cursor:pointer;list-style:none;margin:0;padding:2px 0}
details.logwrap summary::-webkit-details-marker{display:none}
details.logwrap summary span:first-child::after{content:" ▸";font-family:Nunito}
details.logwrap[open] summary span:first-child::after{content:" ▾"}
details.logwrap .log{margin-top:6px}

/* ---------- rarity key ---------- */
.rarkey{position:relative;display:inline-block;margin-left:10px;font-family:Nunito,sans-serif;font-size:12px;font-weight:900;letter-spacing:0;color:#ffe3a3;background:#0007;border:1px solid var(--brass2);border-radius:20px;padding:2px 10px;cursor:help;text-shadow:none;vertical-align:2px}
.rarkey:hover,.rarkey:focus{border-color:var(--brass);outline:none}
.rarpop{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:300;width:min(330px,calc(100vw - 32px));background:#160d14;border:2px solid var(--brass);border-radius:12px;padding:10px 12px;box-shadow:0 14px 30px #000d;text-align:left;cursor:default}
.rarkey:hover .rarpop,.rarkey:focus .rarpop,.rarkey:focus-within .rarpop{display:grid;gap:7px}
.rk-h{font-family:Bangers,Impact,sans-serif;font-size:19px;letter-spacing:1px;color:#ffd77a}
.rk-row{display:flex;gap:10px;align-items:center}
.rk-sw{flex:none;width:26px;height:36px;border-radius:6px;background:var(--frame);box-shadow:inset 0 0 0 4px #160d14cc,0 0 8px var(--gem)}

.rk-n{font-size:14px;color:var(--tc)}
.rk-m{font-size:11px;font-weight:900;color:#f4e8d4;background:#ffffff14;border-radius:5px;padding:0 6px;margin-left:4px}
.rk-d{font-size:12px;font-weight:600;color:#d8c3a0;line-height:1.3}
.rk-f{font-size:11.5px;font-weight:600;color:#a8947a;line-height:1.35;border-top:1px solid #ffffff14;padding-top:7px}
.ui-manga .rarpop{background:#fff;border-color:#111;box-shadow:5px 5px 0 #111}.ui-manga .rk-d,.ui-manga .rk-m,.ui-manga .rk-f{color:#333}.ui-manga .rarkey{background:#fff;color:#111}

/* ---------- acts, rest, quests, event rarity ---------- */
.acthd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.acthd h2{margin:0!important}
.actbar{font-size:13px;font-weight:800;color:#e8d0b0;background:#0006;border:1px solid var(--brass2);border-radius:20px;padding:2px 10px}
.actbar b{color:#ff9a9a}
.questchip{font-size:12px;font-weight:900;color:#3a1d05;background:linear-gradient(#ffe48a,#e0a028);border-radius:20px;padding:2px 10px}
.restrow{display:flex;justify-content:center;margin-top:8px}
.restbtn{padding:5px 14px;font-size:13px;border-radius:20px;opacity:.9}.restbtn .small{color:#e8d0b0;margin-left:4px}
.choice.ev-rare{--cg:#4a9aff77;border-color:#7fc0ff}.choice.ev-rare .kind{color:#9cd2ff;border-color:#4a7aaa}
.choice.ev-legendary{--cg:#ff9ad277;border-color:#ffb0e0;box-shadow:inset 0 0 0 2px #1d0812,0 0 18px #ff9ad266}.choice.ev-legendary .kind{color:#ffb0e0;border-color:#c0609a}
.ui-manga .actbar,.ui-manga .restbtn .small{color:#111;background:#fff}
/* ---------- item tooltip ---------- */
#itemtip{position:fixed;z-index:500;display:none;pointer-events:none;width:min(300px,calc(100vw - 20px));animation:ttIn .12s ease-out}
@keyframes ttIn{from{opacity:0;transform:translateY(4px)}}
.tt-in{border-radius:12px;padding:3px;background:var(--frame);box-shadow:0 12px 28px #000d,0 0 0 1px #000}
.tt-in>*{background:#160d14}
.tt-in>:first-child{border-radius:9px 9px 0 0}.tt-in>:last-child{border-radius:0 0 9px 9px}
.tth{display:flex;gap:10px;align-items:center;padding:10px 10px 6px;background:linear-gradient(#2a1a26,#160d14)}
.ttico{width:42px;height:42px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 40%,#2a1a26),#120a12);box-shadow:inset 0 0 0 1px #ffffff22}
.ttn{flex:1;min-width:0}.ttn b{display:block;font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:21px;letter-spacing:.6px;line-height:1.05;color:#fff4dc}
.ttsub{font-size:12px;color:#d8c3a0;font-weight:700;margin-top:2px}
.ttk{margin-left:6px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;border-radius:5px;padding:1px 5px;vertical-align:1px}
.ttk.ult{background:#ffd23f;color:#3a1d05}.ttk.fus{background:#c471f5;color:#fff}.ttk.en{background:#b23a48;color:#fff}
.ttcd{flex:none;text-align:center;font-size:11px;color:#d8c3a0;background:#0008;border:1px solid #ffffff22;border-radius:8px;padding:3px 7px;line-height:1.1}
.ttcd b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.tttags{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px}
.tttags span{font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#ffd77a;background:#0007;border:1px solid #7a531c;border-radius:5px;padding:1px 6px}
.ttfx{list-style:none;margin:0;padding:8px 10px;display:grid;gap:5px;border-top:1px solid #ffffff14;font-size:14px;line-height:1.3;color:#f4e8d4}
.ttfx li{display:flex;gap:8px;align-items:flex-start}
.ttfx b{color:var(--fc);font-size:15px}
.tti{width:20px;flex:none;text-align:center}
.ttchips{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px}
.ttc{font-size:12px;font-weight:800;color:#f4e8d4;background:#ffffff12;border-radius:6px;padding:2px 7px}.ttc.gold{color:#ffe48a}
.ttx{font-size:12.5px;line-height:1.35;color:#e8d8c0;padding:6px 10px;border-top:1px solid #ffffff14}
.ttx b{color:#ffd77a}.ttx.ench{color:#cfe8ff}.ttx.fuse{color:#e8c8ff}
.ttf{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#a8947a;padding:6px 10px 8px;border-top:1px solid #ffffff14}
/* ---------- boss arenas ---------- */
.arena-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.arena-bg>div{position:absolute;inset:0}
.in-arena{z-index:1}
.in-arena .cside{background:#0a060c70!important;backdrop-filter:blur(1.5px)}
.in-arena .logwrap{background:#0a060ca0!important}
.arena-title{position:fixed;left:0;right:0;top:calc(30px + env(safe-area-inset-top,0px));z-index:2;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:arT 4s ease-out forwards}
.arena-title b{font-family:Bangers,Impact,sans-serif;font-size:clamp(28px,6vw,52px);letter-spacing:2px;font-weight:400;color:var(--arc,#fff);text-shadow:0 3px 0 #000,0 0 22px var(--arc,#fff)}
.arena-title span{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:1px}
@keyframes arT{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.ap{position:absolute;left:var(--x);top:var(--y);animation:var(--t) linear var(--d) infinite;pointer-events:none}
.board.ar-board{border-width:3px;box-shadow:0 0 22px var(--arc),inset 0 0 26px #0009}
/* Namek */
.ar-namek{--arc:#7dffb0;background:radial-gradient(ellipse at 70% 110%,#ff5a1a88,transparent 45%),radial-gradient(circle at 20% 20%,#c8ffe0,transparent 25%),linear-gradient(#3fbf9f,#1a6a5a 55%,#2a1a10)}
.ar-namek .ar-l1{background:radial-gradient(ellipse at 15% 85%,#2a5a3a 0 12%,transparent 13%),radial-gradient(ellipse at 80% 80%,#2a5a3a 0 9%,transparent 10%),radial-gradient(circle at 25% 74%,#4aa06a 0 3%,transparent 3.3%),radial-gradient(circle at 78% 70%,#4aa06a 0 2.5%,transparent 2.8%)}
.ar-namek .ar-l2{background:repeating-linear-gradient(120deg,transparent 0 60px,#ff7a2a55 60px 62px,transparent 62px 140px);mask:linear-gradient(transparent 70%,#000);-webkit-mask:linear-gradient(transparent 70%,#000);animation:arPulse 1.6s ease-in-out infinite}
.ap-ember{width:5px;height:5px;border-radius:50%;background:#ffb43b;box-shadow:0 0 8px #ff7a2a;top:100%;animation-name:arRise}
.ar-namek-b{border-color:#7dffb0;--arc:#7dffb0;background:linear-gradient(#0006,#0008),linear-gradient(#2a8a6a,#0a3a2a)}
/* Infinity Castle */
.ar-castle{--arc:#ff4a5a;background:radial-gradient(circle at 50% 30%,#7a0a1a,transparent 45%),linear-gradient(#1a0a0a,#0a0505)}
.ar-castle .ar-l1{background:repeating-linear-gradient(90deg,#3a1a0a 0 6px,transparent 6px 90px),repeating-linear-gradient(0deg,#3a1a0a 0 6px,transparent 6px 70px),linear-gradient(#e8d8a822,#e8d8a811);animation:arShift 9s ease-in-out infinite alternate}
.ar-castle .ar-l2{background:repeating-linear-gradient(90deg,transparent 0 120px,#2a0a05 120px 128px,transparent 128px 240px);transform:perspective(500px) rotateX(55deg) translateY(30%);opacity:.8;animation:arShift 6s ease-in-out infinite alternate-reverse}
.ap-note{font-size:22px;filter:drop-shadow(0 0 6px #ff4a5a);animation-name:arFloat;opacity:.8}
.ar-castle-b{border-color:#ff4a5a;--arc:#ff4a5a;background:linear-gradient(#0007,#0009),repeating-linear-gradient(90deg,#5a2a10 0 44px,#3a1a0a 44px 48px)}
/* Malevolent Shrine */
.ar-shrine{--arc:#ff2a2a;background:radial-gradient(ellipse at 50% 120%,#5a0000,transparent 60%),linear-gradient(#120000,#2a0000 60%,#050000)}
.ar-shrine .ar-l1{background:linear-gradient(transparent 55%,#000 55%) 50% 100%/260px 260px no-repeat,radial-gradient(ellipse at 50% 56%,#ff2a2a33,transparent 30%);clip-path:polygon(35% 100%,38% 58%,30% 58%,50% 42%,70% 58%,62% 58%,65% 100%)}
.ar-shrine .ar-l2{background:radial-gradient(circle at 50% 60%,#ff2a2a22,transparent 50%);animation:arPulse 2.2s ease-in-out infinite}
.ap-slash{width:60vw;height:3px;left:calc(var(--x) - 30vw);background:linear-gradient(90deg,transparent,#fff,#ff6a6a,transparent);transform:rotate(calc(var(--z) * 60deg - 30deg));animation-name:arSlash;opacity:0;box-shadow:0 0 12px #ff2a2a}
.ar-shrine-b{border-color:#ff2a2a;--arc:#ff2a2a;background:linear-gradient(#0007,#000a),repeating-linear-gradient(0deg,#3a0000 0 30px,#1a0000 30px 32px)}
/* Onigashima */
.ar-onigashima{--arc:#b07cff;background:radial-gradient(ellipse at 60% 0,#5a3a8a,transparent 55%),linear-gradient(#1a1030,#0a0a18 60%,#05050c)}
.ar-onigashima .ar-l1{background:radial-gradient(ellipse at 20% 15%,#3a2a5a 0 18%,transparent 30%),radial-gradient(ellipse at 75% 10%,#2a1a4a 0 20%,transparent 32%);animation:arDrift 20s linear infinite alternate}
.ar-onigashima .ar-l2{background:#e8dcff;opacity:0;animation:arFlash 7s linear infinite}
.ap-rain{width:1.5px;height:40px;background:linear-gradient(transparent,#c8b6ffaa);top:-50px;animation-name:arRain;animation-duration:calc(var(--t) / 6)}
.ar-onigashima-b{border-color:#b07cff;--arc:#b07cff;background:linear-gradient(#0006,#0009),linear-gradient(#3a2a5a,#1a1030)}
/* Infinite Tsukuyomi */
.ar-tsukuyomi{--arc:#ff3a3a;background:radial-gradient(circle at 50% 28%,#ff3a3a 0 9%,#a00 10%,transparent 11%),radial-gradient(circle at 50% 28%,#ff2a2a55,transparent 30%),linear-gradient(#1a0a14,#2a0a0a 70%,#100508)}
.ar-tsukuyomi .ar-l1{background:repeating-radial-gradient(circle at 50% 28%,transparent 0 22px,#00000066 22px 24px);mask:radial-gradient(circle at 50% 28%,#000 0 9%,transparent 9.5%);-webkit-mask:radial-gradient(circle at 50% 28%,#000 0 9%,transparent 9.5%);animation:arPulse 3s ease-in-out infinite}
.ar-tsukuyomi .ar-l2{background:radial-gradient(ellipse at 50% 110%,#3a2a1a,transparent 50%)}
.ap-meteor{width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,#ffb43b,#fff);box-shadow:0 0 14px #ff7a2a;transform:rotate(30deg);top:-10%;animation-name:arMeteor}
.ar-tsukuyomi-b{border-color:#ff3a3a;--arc:#ff3a3a;background:linear-gradient(#0007,#000a),linear-gradient(#3a0a14,#1a0508)}
/* Father */
.ar-circle{--arc:#ff4a3a;background:radial-gradient(circle at 50% 55%,#3a0a0a,#0a0505 70%)}
.ar-circle .ar-l1{inset:-30%;background:radial-gradient(circle,transparent 0 30%,#ff4a3a66 30.3% 31%,transparent 31.3% 44%,#ff4a3a55 44.3% 45%,transparent 45.3%),repeating-conic-gradient(from 0deg,#ff4a3a33 0 2deg,transparent 2deg 30deg);mask:radial-gradient(circle,#000 0 45%,transparent 46%);-webkit-mask:radial-gradient(circle,#000 0 45%,transparent 46%);animation:arSpin 40s linear infinite}
.ar-circle .ar-l2{background:radial-gradient(circle at 50% 55%,#ff4a3a22,transparent 40%);animation:arPulse 2s ease-in-out infinite}
.ap-spark{width:3px;height:3px;background:#ff8a6a;border-radius:50%;box-shadow:0 0 8px #ff4a3a;animation-name:arTwinkle}
.ar-circle-b{border-color:#ff4a3a;--arc:#ff4a3a;background:linear-gradient(#0007,#000a),repeating-linear-gradient(90deg,#3a3a3a 0 40px,#2a2a2a 40px 42px)}
/* Cosmic Fear */
.ar-cosmic{--arc:#9cf0ff;background:radial-gradient(ellipse at 50% 50%,#2a1a5a,#05030f 70%)}
.ar-cosmic .ar-l1{inset:-40%;background:conic-gradient(from 0deg,#ff2a8a22,#2affff22,#7a2aff22,#ff2a8a22);mask:radial-gradient(circle,#000,transparent 60%);-webkit-mask:radial-gradient(circle,#000,transparent 60%);animation:arSpin 30s linear infinite}
.ap-star{width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation-name:arTwinkle}
.ar-cosmic-b{border-color:#9cf0ff;--arc:#9cf0ff;background:linear-gradient(#0006,#0009),radial-gradient(circle at 30% 40%,#3a2a7a,#0a0520)}
/* Makima */
.ar-control{--arc:#ff9a3c;background:radial-gradient(ellipse at 50% 0,#ff9a3c66,transparent 60%),linear-gradient(#5a2a1a,#2a1010 60%,#140808)}
.ar-control .ar-l1{background:radial-gradient(circle at 50% 22%,#ffd27a 0 3%,transparent 3.5%),radial-gradient(circle at 50% 22%,#ffd27a22 0,transparent 20%)}
.ap-chain{top:-5%;width:10px;height:70vh;background:repeating-linear-gradient(#c8c8d0 0 8px,transparent 8px 10px,#8a8a98 10px 18px,transparent 18px 20px);border-radius:5px;transform-origin:top;animation-name:arSway;animation-timing-function:ease-in-out;opacity:.55}
.ar-control-b{border-color:#ff9a3c;--arc:#ff9a3c;background:linear-gradient(#0006,#0009),linear-gradient(#6a3020,#3a1810)}
/* Las Noches */
.ar-nochies{--arc:#e8e4ff;background:radial-gradient(circle at 78% 18%,#fff 0 4%,transparent 4.3%),linear-gradient(#05050a,#14142a 60%,#e8e4da 60.5%,#bdb6a6)}
.ar-nochies .ar-l1{background:radial-gradient(circle at 76% 17%,#05050a 0 4%,transparent 4.3%),radial-gradient(ellipse at 50% 61%,#fff8 0,transparent 30%)}
.ar-nochies .ar-l2{background:linear-gradient(transparent 58%,#fff 58% 58.4%,transparent 59%);opacity:.5}
.ap-fly{font-size:calc(var(--z) * 18px);animation-name:arFlutter;filter:hue-rotate(250deg) drop-shadow(0 0 6px #b07cff)}
.ar-nochies-b{border-color:#e8e4ff;--arc:#e8e4ff;background:linear-gradient(#0005,#0008),repeating-linear-gradient(0deg,#e8e4da 0 28px,#bdb6a6 28px 30px)}
/* Decay */
.ar-decay{--arc:#b8c0c8;background:linear-gradient(#3a3a40,#1a1a1e 70%,#0a0a0c)}
.ar-decay .ar-l1{background:repeating-linear-gradient(90deg,transparent 0 30px,#00000044 30px 34px,transparent 34px 80px),linear-gradient(transparent 50%,#2a2a2e 50%)}
.ar-decay .ar-l2{background:conic-gradient(from 20deg at 50% 100%,transparent 0 8deg,#000 8deg 9deg,transparent 9deg 30deg,#000 30deg 31deg,transparent 31deg 52deg,#000 52deg 53deg,transparent 53deg);opacity:.6;transform-origin:50% 100%;animation:arGrow 8s ease-in infinite}
.ap-dust{width:4px;height:4px;background:#9a9aa0;border-radius:1px;animation-name:arCrumble}
.ar-decay-b{border-color:#b8c0c8;--arc:#b8c0c8;background:linear-gradient(#0006,#0009),repeating-linear-gradient(90deg,#5a5a60 0 40px,#3a3a40 40px 43px)}
/* The Paths */
.ar-paths{--arc:#9cf0ff;background:radial-gradient(ellipse at 50% 40%,#2a4a7a,#05081a 70%)}
.ar-paths .ar-l1{background:radial-gradient(ellipse at 50% 45%,#bff6ff 0 1%,#9cf0ff55 3%,transparent 25%);animation:arPulse 4s ease-in-out infinite}
.ar-paths .ar-l2{background:repeating-conic-gradient(from 200deg at 50% 45%,#9cf0ff33 0 1.2deg,transparent 1.2deg 14deg);mask:radial-gradient(circle at 50% 45%,#000 10%,transparent 45%);-webkit-mask:radial-gradient(circle at 50% 45%,#000 10%,transparent 45%)}
.ap-sand{width:3px;height:3px;border-radius:50%;background:#ffe8b0;box-shadow:0 0 6px #ffe8b0;animation-name:arDrift2}
.ar-paths-b{border-color:#9cf0ff;--arc:#9cf0ff;background:linear-gradient(#0005,#0008),linear-gradient(#c8a870,#8a6a3a)}
/* Weisse */
.ar-weisse{--arc:#ffd23f;background:linear-gradient(#5a4a2a,#2a2010)}
.ar-weisse .ar-l1{background:linear-gradient(100deg,transparent 30%,#ffd23f44 45%,#fff6 50%,#ffd23f44 55%,transparent 70%) 0 0/300% 100%;animation:arSweep 6s ease-in-out infinite}
.ar-weisse .ar-l2{background:repeating-linear-gradient(90deg,#d9a44a33 0 40px,transparent 40px 46px,#b8860b33 46px 90px),linear-gradient(transparent 40%,#d9a44a55);clip-path:inset(30% 0 0 0)}
.ap-glint{width:6px;height:6px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation-name:arTwinkle;filter:drop-shadow(0 0 4px #ffd23f)}
.ar-weisse-b{border-color:#ffd23f;--arc:#ffd23f;background:linear-gradient(#0004,#0007),linear-gradient(135deg,#fff3b0,#b8860b 40%,#ffe066 60%,#7a5200)}

/* arena details drawn in front of the fight panels (never block clicks) */
.arena-front{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;opacity:.6}
.af-shrine{opacity:1}.af-castle,.af-nochies{opacity:.75}
.in-arena .cside{background:#0a060c5c!important}
/* Malevolent Shrine, brighter: blood sky, glowing shrine, cleave flashes */
.ar-shrine{background:radial-gradient(ellipse at 50% 105%,#ff2a1a 0,#a00 18%,transparent 55%),radial-gradient(ellipse at 50% 0,#6a0010,transparent 60%),linear-gradient(#2a0006,#5a0008 55%,#1a0002)!important}
.ar-shrine .ar-l1{clip-path:none!important;background:
  linear-gradient(#0a0000,#0a0000) 50% 100%/34% 46% no-repeat,
  conic-gradient(from 180deg at 50% 0,transparent 62deg,#0a0000 62deg 298deg,transparent 298deg) 50% 54%/60% 12% no-repeat,
  conic-gradient(from 180deg at 50% 0,transparent 66deg,#0a0000 66deg 294deg,transparent 294deg) 50% 44%/48% 10% no-repeat!important;
  filter:drop-shadow(0 0 18px #ff2a2a) drop-shadow(0 0 4px #ff6a4a)}
.ar-shrine .ar-l2{background:radial-gradient(ellipse at 50% 80%,#ff3a2a55,transparent 45%)!important;animation:arPulse 1.4s ease-in-out infinite!important}
.ar-shrine .ar-l3{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff00 0 22px,#00000033 22px 24px),radial-gradient(ellipse,transparent 40%,#000a 100%)}
.ap-slash{height:5px!important;border-radius:5px;width:80vw!important;left:calc(var(--x) - 40vw)!important;background:linear-gradient(90deg,transparent,#fff 40%,#ffd0d0 60%,transparent)!important;box-shadow:0 0 10px #fff,0 0 26px #ff2a2a!important;animation-timing-function:ease-out!important}

<body>
<div id="app"></div>
<div id="sellzone" data-drop="sell">💰 Drop here to sell</div>
<div id="insmark"></div>
<div id="toast"></div>
<script src="audio/bank.js"></script>
<script>
'use strict';
// ================= RNG & helpers =================
let R=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(R()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let UID=1;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

// Anime Bazaar VFX engine: code-drawn attack effects on a full-screen canvas, plus DOM cut-ins.
// Every effect takes viewport points/rects, so it works with any layout. Sprite sheets can replace
// any effect later via VFX.sprites[type] = {img, frames, fps, size} (see drawSprite).
const VFX=(()=>{
  let cv=null,ctx=null,W=0,H=0,list=[],running=false,last=0,speed=1;
  const cfg={level:'full',shake:true,cinematics:true};
  const reduced=()=>cfg.level==='off'||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const lite=()=>cfg.level==='lite';
  function init(){
    if(cv)return;
    cv=document.createElement('canvas');cv.id='vfx';cv.setAttribute('aria-hidden','true');
    Object.assign(cv.style,{position:'fixed',left:0,top:0,pointerEvents:'none',zIndex:160});
    document.body.appendChild(cv);resize();addEventListener('resize',resize);
  }
  function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0)}
  function add(e){if(reduced())return;init();e.t=0;list.push(e);if(list.length>60)list.shift();if(!running){running=true;last=performance.now();requestAnimationFrame(tick)}}
  function tick(now){
    const dt=Math.min(.05,(now-last)/1000)*speed;last=now;ctx.clearRect(0,0,W,H);
    list=list.filter(e=>{e.t+=dt;const k=Math.min(1,e.t/e.dur);
      if(e.at&&!e.fired&&k>=e.at){e.fired=true;e.hit&&e.hit()}
      ctx.save();try{e.draw(ctx,k,e.t)}catch(err){}ctx.restore();return k<1});
    if(list.length)requestAnimationFrame(tick);else{running=false;ctx.clearRect(0,0,W,H)}
  }
  const pt=el=>{if(!el)return null;if(el.x!=null)return el;const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}};
  const ease=k=>1-Math.pow(1-k,3);
  const rnd=(a,b)=>a+Math.random()*(b-a);

  // ---------- primitives ----------
  function sparks(x,y,color,n=16,spd=260,dur=.6,size=3,grav=260){
    if(lite())n=Math.ceil(n/2);
    const ps=Array.from({length:n},()=>{const a=rnd(0,Math.PI*2),s=spd*rnd(.35,1.1);return {vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:size*rnd(.6,1.6)}});
    add({dur,draw(c,k,t){c.globalCompositeOperation='lighter';c.fillStyle=color;
      for(const p of ps){c.globalAlpha=1-k;c.beginPath();c.arc(x+p.vx*t,y+p.vy*t+.5*grav*t*t,p.r*(1-k*.5),0,7);c.fill()}}});
  }
  function ring(x,y,color,r0=10,r1=90,dur=.45,w=6){
    add({dur,draw(c,k){c.globalCompositeOperation='lighter';c.globalAlpha=1-k;c.strokeStyle=color;c.lineWidth=w*(1-k)+1;c.beginPath();c.arc(x,y,r0+(r1-r0)*ease(k),0,7);c.stroke()}});
  }
  function flash(color='#fff',alpha=.5,dur=.18){if(lite())alpha*=.35;add({dur,draw(c,k){c.globalAlpha=alpha*(1-k);c.fillStyle=color;c.fillRect(0,0,W,H)}})}
  function shake(power=6,ms=260){
    if(reduced()||lite()||!cfg.shake)return;const el=document.getElementById('app')||document.body;
    el.style.setProperty('--shk',power+'px');el.classList.remove('vfx-shake');void el.offsetWidth;el.classList.add('vfx-shake');
    clearTimeout(shake.h);shake.h=setTimeout(()=>el.classList.remove('vfx-shake'),ms);
  }
  function glowLine(c,a,b,color,w,alpha=1){
    c.lineCap='round';c.globalCompositeOperation='lighter';
    c.globalAlpha=.35*alpha;c.strokeStyle=color;c.lineWidth=w*2.2;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();
    c.globalAlpha=.9*alpha;c.lineWidth=w;c.stroke();
    c.globalAlpha=alpha;c.strokeStyle='#fff';c.lineWidth=w*.35;c.stroke();
  }
  function impact(p,color,big){sparks(p.x,p.y,color,big?34:18,big?420:260);ring(p.x,p.y,color,8,big?160:80,big?.6:.4,big?10:6);if(big){flash(color,.35);shake(10,380)}else shake(4,200)}

  // ---------- attack effects ----------
  // Beam: Kamehameha, Hollow Purple, Final Flash, Getsuga Tensho, Zoltraak
  function beam(from,to,color='#6fd3ff',opt={}){
    const a=pt(from),b=pt(to);if(!a||!b)return;const w=opt.width||22,big=opt.big!==false;
    add({dur:.75,at:.22,hit:()=>impact(b,color,big),draw(c,k){
      const grow=Math.min(1,k/.22),fade=k>.6?1-(k-.6)/.4:1,tip={x:a.x+(b.x-a.x)*grow,y:a.y+(b.y-a.y)*grow};
      const ww=w*(k<.22?.6+grow*.4:1+.15*Math.sin(k*60))*fade;
      // charge orb at the source
      c.globalCompositeOperation='lighter';const g=c.createRadialGradient(a.x,a.y,0,a.x,a.y,w*1.6);g.addColorStop(0,'#fff');g.addColorStop(.4,color);g.addColorStop(1,'transparent');
      c.globalAlpha=fade;c.fillStyle=g;c.beginPath();c.arc(a.x,a.y,w*1.6,0,7);c.fill();
      glowLine(c,a,tip,color,ww,fade);
      const g2=c.createRadialGradient(tip.x,tip.y,0,tip.x,tip.y,ww*1.8);g2.addColorStop(0,'#fff');g2.addColorStop(.5,color);g2.addColorStop(1,'transparent');
      c.fillStyle=g2;c.beginPath();c.arc(tip.x,tip.y,ww*1.8,0,7);c.fill();
    }});
  }
  // Slash: swords and blades. Crescent arcs swept across the target.
  function slash(to,color='#e8f4ff',opt={}){
    const p=pt(to);if(!p)return;const n=opt.count||2,R=Math.max(40,(p.w||80)*.75);
    for(let i=0;i<n;i++){const rot=rnd(-.9,.9)+i*1.2,dx=rnd(-10,10),dy=rnd(-10,10),delay=i*.07;
      add({dur:.36+delay,draw(c,k,t){const kk=Math.max(0,(t-delay)/.36);if(kk<=0)return;
        const sweep=ease(Math.min(1,kk*1.6)),fade=kk>.55?1-(kk-.55)/.45:1,a0=-1.2,a1=a0+2.4*sweep;
        c.translate(p.x+dx,p.y+dy);c.rotate(rot);c.globalCompositeOperation='lighter';c.globalAlpha=Math.max(0,fade);
        const g=c.createLinearGradient(-R,0,R,0);g.addColorStop(0,'transparent');g.addColorStop(.5,color);g.addColorStop(1,'#fff');
        c.shadowColor=color;c.shadowBlur=18;c.fillStyle=g;c.beginPath();c.arc(0,0,R,a0,a1);c.arc(R*.26,0,R*.74,a1,a0,true);c.closePath();c.fill();
        c.shadowBlur=8;c.strokeStyle='#fff';c.lineWidth=3.5;c.beginPath();c.arc(0,0,R,a0,a1);c.stroke();}});
    }
    setTimeout(()=>{sparks(p.x,p.y,color,12,220,.4,2.5);shake(3,150)},120/speed);
  }
  // Sphere: Rasengan, Spirit Bomb, Red, Blue. A swirling orb that flies and bursts.
  function sphere(from,to,color='#7fd0ff',opt={}){
    const a=pt(from),b=pt(to);if(!a||!b)return;const r=opt.size||(opt.big?44:20),big=!!opt.big;
    add({dur:big?1.0:.62,at:.72,hit:()=>{impact(b,color,big);ring(b.x,b.y,'#fff',r,r*3,.5,4)},draw(c,k,t){
      const m=Math.min(1,k/.72),e=m*m,x=a.x+(b.x-a.x)*e,y=a.y+(b.y-a.y)*e-Math.sin(m*Math.PI)*(big?120:50);
      if(k>.72)return;
      c.globalCompositeOperation='lighter';
      const g=c.createRadialGradient(x,y,0,x,y,r*1.8);g.addColorStop(0,'#fff');g.addColorStop(.35,color);g.addColorStop(1,'transparent');
      c.fillStyle=g;c.beginPath();c.arc(x,y,r*1.8,0,7);c.fill();
      c.strokeStyle='#fff';c.lineWidth=2;c.globalAlpha=.85;
      for(let i=0;i<3;i++){const ang=t*14+i*2.1;c.beginPath();c.ellipse(x,y,r,r*.45,ang,0,Math.PI*1.3);c.stroke()}
    }});
  }
  // Punch: impact star, manga speed lines, shockwave. huge=true is Serious Punch scale.
  function punch(to,color='#ffd23f',opt={}){
    const p=pt(to);if(!p)return;const huge=!!opt.huge,R=huge?Math.max(W,H):110;
    add({dur:huge?.9:.42,draw(c,k){
      c.globalCompositeOperation='lighter';
      // speed lines converging on the target
      c.globalAlpha=(1-k)*.55;c.strokeStyle='#fff';c.lineWidth=huge?3:1.5;
      for(let i=0;i<(huge?60:26);i++){const ang=i*2.399,r0=(huge?80:40)+k*30,r1=R*(huge?1:1.1);
        c.beginPath();c.moveTo(p.x+Math.cos(ang)*r0,p.y+Math.sin(ang)*r0);c.lineTo(p.x+Math.cos(ang)*r1,p.y+Math.sin(ang)*r1);c.stroke()}
      // impact star
      const s=(huge?140:46)*ease(Math.min(1,k*3)),spikes=12;c.globalAlpha=1-k;c.fillStyle=color;c.beginPath();
      for(let i=0;i<spikes*2;i++){const rr=i%2?s*.42:s,ang=i*Math.PI/spikes;c.lineTo(p.x+Math.cos(ang)*rr,p.y+Math.sin(ang)*rr)}c.closePath();c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,s*.3,0,7);c.fill();
    }});
    ring(p.x,p.y,huge?'#fff':color,10,huge?Math.max(W,H)*.8:100,huge?.8:.4,huge?18:6);
    sparks(p.x,p.y,color,huge?40:14,huge?600:240);
    if(huge){flash('#fff',.8,.35);shake(16,600)}else shake(5,200);
  }
  // Lightning: jagged bolt with branches, re-randomised every few frames.
  function lightning(from,to,color='#fff36b'){
    const a=pt(from),b=pt(to);if(!a||!b)return;let path=null,last=-1;
    const bolt=(p,q,d)=>{let pts=[p,q];for(let i=0;i<5;i++){const n=[];for(let j=0;j<pts.length-1;j++){const u=pts[j],v=pts[j+1];n.push(u,{x:(u.x+v.x)/2+rnd(-d,d),y:(u.y+v.y)/2+rnd(-d,d)})}n.push(pts[pts.length-1]);pts=n;d*=.55}return pts};
    add({dur:.45,at:.05,hit:()=>{impact(b,color,false);flash(color,.25,.12)},draw(c,k,t){
      const f=Math.floor(t/.05);if(f!==last){last=f;const d=Math.hypot(b.x-a.x,b.y-a.y)*.18;path=[bolt(a,b,d)];for(let i=0;i<2;i++){const s=path[0][Math.floor(rnd(8,24))];if(s)path.push(bolt(s,{x:s.x+rnd(-80,80),y:s.y+rnd(-60,60)},30))}}
      c.globalCompositeOperation='lighter';c.lineJoin='round';
      path.forEach((pts,i)=>{for(const [w,col,al] of [[10,color,.35],[4,color,.9],[1.5,'#fff',1]]){c.globalAlpha=al*(1-k)*(i?0.6:1);c.strokeStyle=col;c.lineWidth=i?w*.5:w;c.beginPath();pts.forEach((q,j)=>j?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.stroke()}});
    }});
  }
  // Fallback projectile orb for items without a signature type
  function bolt(from,to,color='#ff5a5a'){
    const a=pt(from),b=pt(to);if(!a||!b)return;
    add({dur:.4,at:.95,hit:()=>sparks(b.x,b.y,color,10,180,.35,2),draw(c,k){const e=k*k,x=a.x+(b.x-a.x)*e,y=a.y+(b.y-a.y)*e-Math.sin(k*Math.PI)*40;
      c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,12);g.addColorStop(0,'#fff');g.addColorStop(.4,color);g.addColorStop(1,'transparent');c.fillStyle=g;c.beginPath();c.arc(x,y,12,0,7);c.fill()}});
  }

  // ---------- status effects on a card or bar ----------
  function rising(p,n,dur,drawOne){const ps=Array.from({length:n},()=>({x:rnd(-.45,.45)*(p.w||60),d:rnd(0,.35),s:rnd(.7,1.3),wob:rnd(0,6)}));
    add({dur,draw(c,k,t){for(const q of ps){const kk=(t/dur-q.d)/(1-q.d);if(kk<=0||kk>=1)continue;drawOne(c,p.x+q.x+Math.sin(t*6+q.wob)*4,p.y+(p.h||80)*.35-kk*(p.h||80)*.9,kk,q.s)}}})}
  function burn(to){const p=pt(to);if(!p)return;rising(p,14,.75,(c,x,y,k,s)=>{c.globalCompositeOperation='lighter';const r=9*s*(1-k*.7);const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fff6a0');g.addColorStop(.4,'#ff9a2a');g.addColorStop(1,'transparent');c.globalAlpha=1-k*.5;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()})}
  function poison(to){const p=pt(to);if(!p)return;rising(p,10,1,(c,x,y,k,s)=>{c.globalAlpha=1-k;c.fillStyle='#8be36b55';c.strokeStyle='#c8ff9a';c.lineWidth=1.5;c.beginPath();c.arc(x,y,6*s,0,7);c.fill();c.stroke();c.fillStyle='#fff9';c.beginPath();c.arc(x-2*s,y-2*s,1.6*s,0,7);c.fill()})}
  function heal(to){const p=pt(to);if(!p)return;rising(p,9,.85,(c,x,y,k,s)=>{c.globalCompositeOperation='lighter';c.globalAlpha=1-k;c.fillStyle='#7dff9a';const a=7*s,b=2.4*s;c.fillRect(x-a,y-b,a*2,b*2);c.fillRect(x-b,y-a,b*2,a*2)});
    add({dur:.6,draw(c,k){c.globalCompositeOperation='lighter';const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,(p.w||80)*.7);g.addColorStop(0,'#7dff9a55');g.addColorStop(1,'transparent');c.globalAlpha=1-k;c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,(p.w||80)*.7,0,7);c.fill()}})}
  function freeze(to){const p=pt(to);if(!p)return;const sh=Array.from({length:9},(_,i)=>({a:i*0.7+rnd(-.2,.2),l:rnd(18,34)}));
    add({dur:.65,draw(c,k){c.globalAlpha=(1-k)*.9;c.fillStyle='#bfe9ff';c.strokeStyle='#ffffff';c.lineWidth=1;
      for(const q of sh){const d=10+ease(Math.min(1,k*2.5))*24,x=p.x+Math.cos(q.a)*d,y=p.y+Math.sin(q.a)*d;c.save();c.translate(x,y);c.rotate(q.a);c.beginPath();c.moveTo(q.l,0);c.lineTo(0,4);c.lineTo(-q.l*.3,0);c.lineTo(0,-4);c.closePath();c.fill();c.stroke();c.restore()}
      c.globalAlpha=(1-k)*.35;c.fillStyle='#6fc3ff';c.fillRect(p.x-(p.w||60)/2,p.y-(p.h||80)/2,p.w||60,p.h||80)}})}
  function shield(to){const p=pt(to);if(!p)return;const R=Math.max(p.w||60,p.h||60)*.6;

  // Signature choreography: charge, travel, impact. Visual only; combat resolves independently.
  function signature(kind,from,to,color='#8bdcff',opt={}){
    const a=pt(from),b=pt(to);if(!a||!b||reduced())return;
    const duration=opt.light?.55:1.05,detail=lite()?8:20;
    const stars=Array.from({length:detail},(_,i)=>({a:i*2.399,r:25+(i%7)*10}));
    const glow=(c,x,y,r,col,alpha=1)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.2,col);g.addColorStop(1,'transparent');c.globalAlpha=alpha;c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()};
    add({dur:duration,draw(c,k,t){
      const travel=Math.max(0,Math.min(1,(k-.2)/.42)),impact=Math.max(0,(k-.62)/.38),fade=Math.max(0,1-impact);
      const x=a.x+(b.x-a.x)*travel,y=a.y+(b.y-a.y)*travel-Math.sin(travel*Math.PI)*45;
      c.globalCompositeOperation='lighter';
      if(kind==='spiral'){
        if(k<.64){glow(c,x,y,30+12*Math.sin(k*Math.PI),color);c.strokeStyle='#e7fbff';c.lineWidth=2;
          for(let j=0;j<5;j++){c.beginPath();for(let i=0;i<40;i++){const q=i/40,ang=q*7+t*22+j*1.25,r=3+q*28;const xx=x+Math.cos(ang)*r,yy=y+Math.sin(ang)*r*.65;i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke()}
          if(opt.big){c.translate(x,y);c.rotate(t*14);for(let j=0;j<4;j++){c.rotate(Math.PI/2);c.fillStyle='#c3efff';c.beginPath();c.moveTo(10,-3);c.lineTo(75,0);c.lineTo(10,5);c.fill()}}
        }
      }else if(kind==='beam'){
        const charge=Math.min(1,k/.22);glow(c,a.x,a.y,14+charge*30,color,fade);
        if(k>.2){const tip={x:a.x+(b.x-a.x)*travel,y:a.y+(b.y-a.y)*travel};glowLine(c,a,tip,color,(opt.width||22)*(1+.1*Math.sin(t*45))*fade,fade);
          const dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len,ny=dx/len;c.strokeStyle=color;c.lineWidth=2;c.globalAlpha=.7*fade;
          for(let j=0;j<5;j++){const q=(t*2+j/5)%1,xx=a.x+dx*q*travel,yy=a.y+dy*q*travel;c.beginPath();c.ellipse(xx,yy,8,26,Math.atan2(ny,nx),0,7);c.stroke()}
        }
      }else if(kind==='purple'){
        if(k<.28){const d=50*(1-k/.28);glow(c,a.x-d,a.y,28,'#ff2e64');glow(c,a.x+d,a.y,28,'#368cff')}
        else if(k<.65){glow(c,x,y,56,'#a45bff');c.strokeStyle='#e8c8ff';c.lineWidth=2;c.beginPath();c.ellipse(x,y,48,16,t*9,0,7);c.stroke();for(const p of stars){c.globalAlpha=.6;const r=p.r*.65;c.fillStyle='#e0bcff';c.fillRect(x+Math.cos(p.a+t)*r,y+Math.sin(p.a+t)*r,2,2)}}
      }else if(kind==='flame'||kind==='water'||kind==='slash'||kind==='chainsaw'){
        const start=-2.5,sweep=Math.min(1,k/.62),R=70;
        c.translate(b.x,b.y);c.rotate(kind==='water'?.3:-.5);c.globalAlpha=fade;
        for(let j=0;j<(kind==='chainsaw'?3:2);j++){
          c.save();c.rotate(j*1.5);c.strokeStyle=kind==='water'?'#72dfff':color;c.lineWidth=kind==='chainsaw'?9:12;c.lineCap='round';c.beginPath();c.arc(0,0,R-j*12,start,start+sweep*4.7);c.stroke();c.strokeStyle='#fff6d9';c.lineWidth=2;c.stroke();
          for(let i=0;i<detail;i++){const q=i/detail,ang=start+q*sweep*4.7,rr=R-j*12;c.save();c.translate(Math.cos(ang)*rr,Math.sin(ang)*rr);c.rotate(ang+t*2);c.fillStyle=kind==='flame'?'#ffc746':kind==='water'?'#c5f7ff':color;c.beginPath();if(kind==='chainsaw'){c.moveTo(0,-8);c.lineTo(9,0);c.lineTo(0,9)}else{c.ellipse(0,0,kind==='flame'?5:2,kind==='flame'?15:5,0,0,7)}c.fill();c.restore()}c.restore();
        }
      }else if(kind==='alchemy'){
        c.translate(b.x,b.y);c.globalAlpha=Math.min(1,k*5)*fade;c.strokeStyle='#8ce9ff';c.lineWidth=2;const r=20+65*ease(Math.min(1,k*2));
        for(const f of [1,.82,.4]){c.beginPath();c.arc(0,0,r*f,0,7);c.stroke()}
        for(let j=0;j<2;j++){c.beginPath();for(let i=0;i<=3;i++){const ang=i*Math.PI*2/3-Math.PI/2+j*Math.PI,xx=Math.cos(ang)*r*.82,yy=Math.sin(ang)*r*.82;i?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.stroke()}
        if(k>.3)for(let i=0;i<5;i++){const xx=(i-2)*27,h=(28+i%3*18)*Math.sin(Math.min(1,(k-.3)/.4)*Math.PI/2)*fade;c.fillStyle='#758ba5';c.beginPath();c.moveTo(xx-8,25);c.lineTo(xx,25-h);c.lineTo(xx+10,25);c.fill()}
      }else if(kind==='void'){
        c.translate(b.x,b.y);c.globalCompositeOperation='source-over';c.globalAlpha=.7*Math.sin(k*Math.PI);const g=c.createRadialGradient(0,0,5,0,0,110);g.addColorStop(0,'#080318');g.addColorStop(.75,'#241343');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(-110,-110,220,220);c.globalCompositeOperation='lighter';
        for(let j=0;j<4;j++){c.strokeStyle=j%2?'#b97cff':'#8edaff';c.lineWidth=1.5;c.beginPath();c.ellipse(0,0,35+j*20,12+j*8,t*(j%2?1:-1)+j,0,7);c.stroke()}

        c.translate(b.x,b.y);for(const p of stars){const r=(12+k*75);c.save();c.translate(Math.cos(p.a)*r,Math.sin(p.a)*r-k*25);c.rotate(p.a+t);c.globalAlpha=Math.sin(k*Math.PI);c.fillStyle=p.r%2?'#97ffc8':'#fff0af';c.beginPath();c.ellipse(0,0,3,9,0,0,7);c.fill();c.restore()}

    }});
  }

// ================= hero passives: one built-in perk per hero (applies to rival ghosts of that hero too) =================
const isW=it=>it.def.tags.includes('Weapon'),below=(s,f)=>s.hp<s.max*f;
const FLANK_CRIT=[.05,.07,.1,.12,.15];
const DISCHARGE_MIN=10;
function chargeCombatItem(it,seconds){if(seconds>0){it.prog+=seconds;it.externallyCharged=true}}
function relayWeapon(side,it){const weapons=side.items.filter(o=>o!==it&&isW(o)).sort((a,b)=>a.slot-b.slot);return weapons.find(o=>o.slot>it.slot)||weapons[0]}
const PASSIVES={
 naruto:{name:'Will of Fire',icon:'🔥',desc:'Once per fight, when you drop below 50% HP, gain shield equal to 25% of your max HP and haste all your items for 2s.',
   low(s){s.shield+=Math.round(s.max*.25);for(const o of s.items)o.haste=Math.min(6,o.haste+2);return 'Will of Fire! Shield and haste'}},

   onUse(s,f,it){if(s.hp>0&&allFx(it.inst).some(x=>x.t==='selfdmg'&&x.v>0))s.unluck=Math.min(50,s.unluck+5)}},

   onCrit(s,f){if(R()<.3){const d=12*Math.max(1,S?S.day:1);damage(f,d,'hit');damage(s,3,'self');if(!F.skipping)VFX.lightning(avEl(s),avEl(f),'#ffe04a');log(s,`🌩️ Unluck disaster! ${d} dmg`)}}},

};
const passiveOf=id=>PASSIVES[id]||null;
const passiveHTML=id=>{const p=passiveOf(id);return p?`<span class="passive" title="${esc(p.desc)}">${p.icon} <b>${p.name}</b>: ${p.shortDesc||p.desc}</span>`:''};

function artInfo(value){
 if(typeof value==='string')return {src:value};
 if(!value||typeof value.src!=='string')return null;
 const a={src:value.src};if(typeof value.focus==='string')a.focus=value.focus;if(value.fit==='contain')a.fit='contain';
 if(value.crop){const c=value.crop,nums=['x','y','w','h','imageWidth','imageHeight'].map(k=>Number(c[k]));
  if(!nums.every(Number.isFinite))return null;
  const [x,y,w,h,imageWidth,imageHeight]=nums;
  if(x<0||y<0||w<=0||h<=0||imageWidth<=0||imageHeight<=0||x+w>imageWidth||y+h>imageHeight)return null;
  a.crop={x,y,w,h,imageWidth,imageHeight};
 }
 return a;
}
function artImage(value,cls='',label=''){
 const a=artInfo(value);if(!a)return '';
 if(a.crop){const c=a.crop;
  const style=`left:${-c.x/c.w*100}%;top:${-c.y/c.h*100}%;width:${c.imageWidth/c.w*100}%;height:${c.imageHeight/c.h*100}%;`;
  return `<span class="art-crop ${esc(cls)}" role="img" aria-label="${esc(label)}"><img src="${esc(a.src)}" alt="" style="${style}" loading="lazy" decoding="async" draggable="false" onerror="this.parentNode.remove()"></span>`;
 }
 return `<img class="${cls}" src="${esc(a.src)}" alt="${esc(label)}" style="object-position:${esc(a.focus||'50% 35%')}${a.fit==='contain'?';object-fit:contain;background:#19131e':''}" loading="lazy" decoding="async" draggable="false" onerror="this.remove()">`;
}

function skillArtHTML(skill){
 const art=skill&&ART.skills[skill.k];
 return art?`<span class="skill-art"><span class="skill-fallback" aria-hidden="true">${esc(skill.icon||'')}</span>${artImage(art,'',`${skill.name} skill artwork`)}</span>`:`<div class="big" aria-hidden="true">${skill&&skill.icon||''}</div>`;
}

function avatarHTML(o){
  const img=o.art||(o.heroId&&ART.heroes[o.heroId])||ART.bosses[o.name]||ART.monsters[o.name];
  return `<div class="avatar ${o.aura?'aura':''}" style="--hc:${o.color};${o.aura?'--aura:'+o.aura:''}">${img?'':`<span class="em">${o.emblem||o.icon||''}</span>`}${artImage(img,'',o.name||'')}${o.init?`<span class="ini">${o.init}</span>`:''}</div>`;
}

 const t=m&&TROPHIES[m.name];if(!t||!S)return m;
 const own=m.items.find(i=>i.id===t.item);if(!own||(S.trophiesSeen||[]).includes(t.item))return m;

}
function trophyValid(tr){return tr&&ITEMS[tr.item]&&TROPHIES[Object.keys(TROPHIES).find(k=>TROPHIES[k].item===tr.item)]&&Number.isInteger(tr.tier)&&tr.tier>=0&&tr.tier<=MAX_TIER&&typeof tr.roll==='number'&&tr.cond&&['time','maxUses'].includes(tr.cond.kind)}

function rollTier(day){

  if(day<=5)return r<.8?0:1;
  if(day<=7)return r<.5?0:r<.95?1:2;

}

 const c=heroTrialConfig();if(!c)return null;
 if(!S.heroTrial){S.heroTrial=freshHeroTrial(c);if(S.ultGiven||[...S.board,...S.stash].some(i=>i.id===c.item||i.id===c.alternateItem)){S.heroTrial.stage='legacy';S.ultGiven=true}}
 return S.heroTrial;
}
function heroTrialAvailable(){const c=heroTrialConfig();if(!c)return false;const t=heroTrialState();return t.stage==='reward'||(t.stage==='idle'&&S.day>=c.minDay&&S.level>=c.minLevel&&arcOptionalHour())}

 const c=heroTrialConfig(),tier=enemyTier(S.day),d=BOSS_DEFS[c.boss],boss=BOSSES.find(b=>b[0]===c.boss),identity=c.opponent||{icon:boss[1],color:boss[2],series:boss[3]};
 return {name:c.enemy,...identity,hp:Math.round((c.hpBase+S.day*c.hpDay)*D().mon/DIFFS.normal.mon),items:buildFixed(c.enemyItems||d.b,BOARD_SLOTS,tier),skills:{startShield:c.shield*(tier+1),weaponDmg:Math.floor(S.day/2),...(c.enemySkills||{})},gold:8+S.day,xp:4,strat:d?.strat||c.pressure,weak:d?.weak||'Inspect the board and prepare a build before committing.'};
}

function acceptHeroTrial(){
 const c=heroTrialConfig(),t=heroTrialState();if(!c||S.phase!=='heroTrial'||!heroTrialAvailable()||t.stage!=='idle'||!t.prep||!t.enemy||t.enemyDay!==S.day)return false;
 const next={...S,heroTrial:{...t,stage:'fighting'}};if(!persistArcCandidate(next))return false;S=next;
 startCombat(t.enemy,'heroTrial',w=>{
  const elapsed=Number((F.ticks*TICK).toFixed(3)),health=F.a.hp/F.a.max;
  const enemyUseCount=c.maxEnemyUse?F.b.items.filter(i=>i.def.id===c.maxEnemyUse.id).reduce((n,i)=>n+i.uses,0):0;
  const passed=w==='a'&&elapsed<=c.limit&&health>=c.minHealth&&!F.a.revived&&(!c.maxEnemyUse||enemyUseCount<=c.maxEnemyUse.limit);
  const state=heroTrialState();state.result={winner:w,elapsed,health,revived:!!F.a.revived,enemyUseCount,passed};state.stage=passed?'reward':'failed';
  state.reason=passed?'':w!=='a'?'The trial was not won.':F.a.revived?'A revival was used.':elapsed>c.limit?'The time limit was missed.':c.maxEnemyUse&&enemyUseCount>c.maxEnemyUse.limit?'The enemy used '+c.maxEnemyUse.label+' too many times.':'You finished below the health objective.';
  afterFight();if(w==='a'){S.gold+=t.enemy.gold;gainXp(t.enemy.xp)}
  finishHour();state.backPhase=S.phase;
  if(passed)S.phase='heroTrial';else toast(c.title+' ended: '+state.reason);
  saveRun();
 },side=>{if(t.prep==='guard')side.shield+=80;else{const w=side.items.filter(i=>i.def.tags.includes('Weapon')).sort((a,b)=>a.slot-b.slot)[0];if(w)chargeCombatItem(w,Math.min(2,Math.max(0,w.cd-w.prog)))}});
 return true;

function claimHeroTrial(kind){
 const c=heroTrialConfig(),t=heroTrialState();if(!c||S.phase!=='heroTrial'||t.stage!=='reward'||!t.result?.passed||!['item','alternate','skill'].includes(kind)||(kind==='alternate'&&!c.alternateItem))return false;
 const next={...S,board:S.board.map(i=>({...i})),stash:S.stash.map(i=>({...i})),skills:{...S.skills},heroTrial:{...t,stage:'complete',chosen:kind},phase:t.backPhase==='pvp'?'pvp':'choose',choices:S.choices.filter(c=>c.type!=='heroTrial'),sel:null};let nextUid=UID;

 if(kind==='item'||kind==='alternate'){
  const inst={uid:nextUid,id:rewardId,tier:c.tier,ench:null,bonus:0},occupied=new Array(BOARD_SLOTS).fill(false);

 if(!persistArcCandidate(next,nextUid))return false;S=next;UID=nextUid;sfx('level');toast(kind==='skill'?c.skill.name+' learned':ITEMS[rewardId].name+' earned');return true;

function tone(freq,dur,type='sine',vol=.15,slide=0,delay=0,dest){
  const c=AUDIO.ctx;if(!c)return;const t=c.currentTime+delay;

  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||AUDIO.sfxGain||AUDIO.master);o.start(t);o.stop(t+dur+.03);
}

const MUS={timer:null,next:0,step:0,prog:[57,53,55,52],scale:[0,3,5,7,10,12]};
const midi=m=>440*Math.pow(2,(m-69)/12);
function startMusic(){
  if(MUS.timer||!AUDIO.musicOn||!ac())return;
  MUS.next=AUDIO.ctx.currentTime+.1;
  MUS.timer=setInterval(()=>{
    const c=AUDIO.ctx,fight=SCREEN==='combat',beat=fight?.16:.22;
    while(MUS.next<c.currentTime+.35){
      const b=MUS.step%16,root=MUS.prog[Math.floor(MUS.step/16)%4],t=Math.max(0,MUS.next-c.currentTime);
      if(b%4===0)tone(midi(root-12),beat*3.5,'triangle',.06,0,t,AUDIO.music);
      if(b%8===4)tone(midi(root-5),beat*2,'triangle',.035,0,t,AUDIO.music);
      if(Math.random()<(fight?.7:.45))tone(midi(root+12+MUS.scale[Math.floor(Math.random()*MUS.scale.length)]),beat*1.4,'sine',.03,0,t,AUDIO.music);
      if(fight&&b%2===0)noise(.05,b%4===0?.05:.02,6000,t,'highpass',AUDIO.music);
      MUS.next+=beat;MUS.step++;
    }
  },100);
}

 const token={};MERCHANT_TRANSITION=token;let curtain,animations=[],done=false;
 const commit=()=>{if(done)return;done=true;ACT[action](arg);render()};
 (async()=>{try{
  const key=leaving?merchantSceneKey():S.hero.id==='ichigo'?'urahara':'ramen';
  if(entering)commit();
  const stage=document.querySelector('.stage');if(!stage){commit();return}
  if(leaving){const c=merchantScene();const text=stage.querySelector('.merchant-dialogue p');if(text)text.textContent=c.farewell}
  curtain=document.createElement('div');curtain.className='merchant-curtain';curtain.dataset.shop=key;curtain.setAttribute('aria-hidden','true');curtain.innerHTML='<i></i><i></i>';stage.appendChild(curtain);
  animations=Array.from(curtain.children).map(el=>el.animate(entering?[{transform:'translateY(0)'},{transform:'translateY(-103%)'}]:[{transform:'translateY(-103%)'},{transform:'translateY(0)'}],{duration:340,easing:'cubic-bezier(.22,.7,.25,1)',fill:'forwards'}));
  await Promise.all(animations.map(a=>a.finished.catch(()=>{})));

 }finally{curtain?.remove();animations.forEach(a=>a.cancel());if(MERCHANT_TRANSITION===token)MERCHANT_TRANSITION=null}})();
 return true;
}

let DRAG=null,suppressClick=false;

function dragInst(d){if(d.kind==='inv')return findInv(+d.arg);if(d.kind==='shop')return S.merchant.items[+d.arg];if(d.kind==='reward')return S.reward.items[+d.arg];return null}
function fuseTarget(src,x,y){const el=document.elementFromPoint(x,y),c=el&&el.closest('.card[data-arg][data-drag="inv"]');if(!c)return null;const t=findInv(+c.dataset.arg);if(!t||t===src)return null;
  const r=RECIPES.find(r=>(r.a===src.id&&r.b===t.id)||(r.b===src.id&&r.a===t.id));return r?{t,r}:null}
function mergeTarget(src,x,y){const el=document.elementFromPoint(x,y),c=el&&el.closest('.card[data-arg][data-drag="inv"]');if(!c)return null;const t=findInv(+c.dataset.arg);return t&&t!==src&&t.id===src.id&&t.tier===src.tier?t:null}
document.addEventListener('pointerdown',e=>{
  if(e.button>0||MERCHANT_TRANSITION)return;const el=e.target.closest('[data-drag]');if(!el||SCREEN!=='run')return;
  DRAG={el,kind:el.dataset.drag,arg:el.dataset.arg,x:e.clientX,y:e.clientY,active:false,pid:e.pointerId};

document.addEventListener('pointermove',e=>{
  if(!DRAG||e.pointerId!==DRAG.pid)return;
  if(!DRAG.active){
    if(Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)<8)return;
    DRAG.active=true;const r=DRAG.el.getBoundingClientRect();DRAG.ox=DRAG.x-r.left;DRAG.oy=DRAG.y-r.top;
    const g=DRAG.el.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');g.removeAttribute('id');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);DRAG.ghost=g;
    DRAG.el.classList.add('dragging');document.body.classList.add('is-dragging');if(DRAG.kind==='inv'){placeSellZone(findInv(+DRAG.arg));document.body.classList.add('drag-inv')}
  }
  e.preventDefault();
  DRAG.ghost.style.left=(e.clientX-DRAG.ox)+'px';DRAG.ghost.style.top=(e.clientY-DRAG.oy)+'px';
  document.querySelectorAll('.dropok').forEach(z=>z.classList.remove('dropok'));
  const z=dropZoneAt(e.clientX,e.clientY),mk=$('#insmark');mk.className='';
  if(z)z.classList.add('dropok');

  const ft=!mt&&DRAG.kind==='inv'&&src?fuseTarget(src,e.clientX,e.clientY):null;
  if(ft){const r=document.querySelector(`.card[data-drag="inv"][data-arg="${ft.t.uid}"]`).getBoundingClientRect();mk.className='slotmark fuse';Object.assign(mk.style,{display:'block',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});return}
  if(mt){const r=document.querySelector(`.card[data-drag="inv"][data-arg="${mt.uid}"]`).getBoundingClientRect();mk.className='slotmark swap';Object.assign(mk.style,{display:'block',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});return}

  }else if(z&&z.dataset.drop==='stash'){
    const cards=[...z.querySelectorAll('.card:not(.dragging)')],idx=stashIndexAt(e.clientX,e.clientY),zr=z.getBoundingClientRect();
    const c=cards[idx]||cards[cards.length-1];let x=zr.left+8,top=zr.top+6,h=zr.height-12;
    if(c){const r=c.getBoundingClientRect();x=cards[idx]?r.left-3:r.right+1;top=r.top;h=r.height}

// while dragging an owned item, the shop/encounter panel at the top turns into the sell zone (far from the stash)
function placeSellZone(inst){
  const z=$('#sellzone'),st=$('.runwrap .stage');if(!z)return;
  const r=st&&st.getBoundingClientRect(),vis=r&&r.bottom>60&&r.top<innerHeight-60;
  const top=vis?Math.max(r.top,8):8,h=vis?Math.min(r.bottom,innerHeight)-top:140;

  z.innerHTML=`<div><div class="sz-big">💰 Drop here to sell</div>${inst?`<div class="sz-sub">${esc(ITEMS[inst.id].name)} sells for ${sellPrice(inst)} gold</div>`:''}</div>`;

function endDrag(e,cancel){
  if(!DRAG)return;const d=DRAG;DRAG=null;
  if(!d.active)return;
  const z=cancel?null:dropZoneAt(e.clientX,e.clientY),src=cancel?null:dragInst(d),mt=src&&mergeTarget(src,e.clientX,e.clientY);
  d.ghost.remove();document.body.classList.remove('is-dragging','drag-inv');const mk=$('#insmark');mk.style.display='none';mk.className='';
  document.querySelectorAll('.dropok').forEach(z=>z.classList.remove('dropok'));d.el.classList.remove('dragging');
  suppressClick=true;setTimeout(()=>suppressClick=false,50);
  if(cancel)return;
  // dropping a hero item onto its fusion partner fuses them
  if(!mt&&d.kind==='inv'&&src){const ft=fuseTarget(src,e.clientX,e.clientY);if(ft){fuse(src,ft.r);render();return}}
  // dropping an item onto an identical one merges it (shop buys and rewards too)
  if(mt){
    if(S.day<TIER_DAY[mt.tier+1]){toast(`${TIERS[mt.tier+1]} merges unlock on Day ${TIER_DAY[mt.tier+1]}.`);render();return}
    if(d.kind==='shop'){const p=price(src.id,src.tier);if(src.sold){render();return}if(S.gold<p){toast(`You need ${p} gold`);render();return}S.gold-=p;src.sold=true;merchantPurchase(src.id);sfx('buy')}
    else if(d.kind==='inv'){S.board=S.board.filter(x=>x!==src);S.stash=S.stash.filter(x=>x!==src)}
    mt.tier++;mt.ench=mt.ench||src.ench;sfx('merge');toast(`${ITEMS[mt.id].name} merged into ${TIERS[mt.tier]}!`);S.sel={k:'inv',uid:mt.uid};
    if(d.kind==='reward')finishHour();render();return;
  }
  if(!z){render();return}
  const zone=z.dataset.drop,size=dragSize(d),slot=zone==='board'?slotAt(z,e.clientX,size,d.ox):undefined,sIdx=zone==='stash'?stashIndexAt(e.clientX,e.clientY):undefined;
  if(d.kind==='inv'){
    const inst=findInv(+d.arg);if(!inst)return;
    const fromBoard=S.board.includes(inst);
    if(zone==='sell'){S.sel={k:'inv',uid:inst.uid};ACT.sell();render();return}
    if(zone==='board'){if(dropOnBoard(inst,slot))sfx('drop')}
    else if(zone==='stash'){
      if(fromBoard&&S.stash.length>=STASH_MAX){toast('Stash is full');render();return}
      let i=sIdx;if(!fromBoard){const old=S.stash.indexOf(inst);S.stash.splice(old,1);if(old<i)i--}else S.board=S.board.filter(x=>x!==inst);
      S.stash.splice(Math.min(i,S.stash.length),0,inst);inst.slot=undefined;sfx('drop');
    }
    S.sel={k:'inv',uid:inst.uid};render();return;
  }
  if(d.kind==='shop'&&(zone==='board'||zone==='stash')){
    const it=S.merchant.items[+d.arg],p=price(it.id,it.tier);
    if(it.sold){render();return}
    if(S.gold<p){toast(`You need ${p} gold`);render();return}
    if(acquire(it.id,it.tier,null,zone,slot,sIdx)){S.gold-=p;it.sold=true;S.sel=null;merchantPurchase(it.id);sfx('buy')}
    render();return;
  }

    const it=S.reward.items[+d.arg];
    if(acquire(it.id,it.tier,it.ench,zone,slot,sIdx)){sfx('buy');finishHour()}
    render();return;
  }
  render();
}

function loop(ts){
  if(SCREEN!=='combat'||!F||F.over)return;
  const dt=F.last?Math.min(0.1,(ts-F.last)/1000):0;F.last=ts;
  VFX.setSpeed(F.speed*SET.animSpeed);
  if(F.paused){updateCombat();requestAnimationFrame(loop);return}
  F.acc+=dt*F.speed;
  while(F.acc>=TICK&&!F.over){step();F.acc-=TICK}
  updateCombat();
  if(F.over){showResult();return}
  requestAnimationFrame(loop);
}

}
