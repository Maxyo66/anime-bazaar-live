  SET[k]=+e.target.value;applySettings();const s=e.target.parentElement.querySelector('.small');if(s)s.textContent=SET[k]+'%'});
// ================= first-time tutorial: coach tips that appear once each during your first runs =================
const TUT=Object.assign({done:false,seen:{}},store.get('abTutorial',{}));
const saveTut=()=>store.set('abTutorial',TUT);
const TIPS=[
 {k:'pick',when:()=>SCREEN==='title'&&!store.get(runKey(),null),title:'Welcome to Anime Bazaar!',text:'Pick a hero to start a run. Each hero has their own items, a <b>passive</b> perk and an <b>Ultimate</b>. New here? Try <b>Casual</b> difficulty first.'},
 {k:'choose',when:()=>SCREEN==='run'&&S.phase==='choose',title:'Choose your encounter',text:'Each day has 4 hours. Each hour, pick one: a <b>shop</b> to buy items, an <b>event</b>, or a <b>monster</b> for gold, XP and loot. Tap <b>🔍 Inspect</b> to see a monster\'s board first.'},
 {k:'board',when:()=>SCREEN==='run'&&S.phase==='choose'&&TUT.seen.choose,title:'Your board',text:'Items on your board fire automatically when their cooldown fills. The board has <b>10 slots</b>: items are 1, 2 or 3 slots wide. Haste and charge effects only reach items that <b>touch</b>, so placement matters.'},
 {k:'shop',when:()=>SCREEN==='run'&&S.phase==='merchant',title:'Shopping',text:'<b>Drag</b> an item onto your board (or stash) to buy it. Hover over any card to read what it does. Drop a <b>duplicate</b> onto its twin to merge it up a tier, or drop a 🧬 item onto its partner to <b>fuse</b> them.'},
 {k:'sell',when:()=>SCREEN==='run'&&S.phase==='merchant'&&TUT.seen.shop,title:'Selling and the stash',text:'Out of space? Items in the <b>stash</b> don\'t fight but are kept for later. Drag an item <b>up onto the shop area</b> at the top to sell it for gold.'},
 {k:'fight',when:()=>SCREEN==='combat',title:'Fights are automatic',text:'Sit back and watch! Change the speed with <b>1× 2× 4×</b> or tap <b>Skip</b> for the result. After 30 seconds a <b>sandstorm</b> hurts both sides, so fights always end.'},
 {k:'skill',when:()=>SCREEN==='run'&&S.pendingSkills>0&&S.skillChoices,title:'Level up!',text:'Every level you pick a <b>skill</b> that lasts the whole run. At level 5 most heroes receive an <b>Ultimate</b>. Naruto, Andy, Shinra and Jinwoo must instead complete their <b>exclusive trials</b> (from Day 4).'},
 {k:'pvp',when:()=>SCREEN==='run'&&S.phase==='pvp',title:'End of the day: PvP',text:'Every evening you fight a board from another player (or a ghost). Wins earn gold and trophies, losses cost <b>prestige 👑</b>. Win <b>10</b> before your prestige runs out to become Champion.'},
 {k:'boss',when:()=>SCREEN==='run'&&S.choices&&S.choices.some(c=>c.type==='boss')&&S.phase==='choose',title:'A boss appears!',text:'Every 3rd day a boss waits in the last hour. Bosses have fixed themed builds and their own arena. Inspect it, then adjust your board to counter it.'},
 {k:'passive',when:()=>SCREEN==='run'&&S.day>=2,title:'Your passive',text:'The badge in the top bar is your hero\'s <b>passive</b>: a built-in perk that is always on. Hover or tap it to read it again.'},

function coach(){
  let el=$('#coach');
  if(TUT.done){if(el)el.remove();return}
  const t=TIPS.find(t=>!TUT.seen[t.k]&&(()=>{try{return t.when()}catch(e){return false}})());
  if(!t){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='coach';el.setAttribute('role','dialog');el.setAttribute('aria-live','polite');document.body.appendChild(el)}
  const n=TIPS.filter(x=>TUT.seen[x.k]).length+1;
  el.innerHTML=`<div class="coach-in velvet"><div class="coach-hd"><b>💡 ${t.title}</b><span class="small">Tip ${n} of ${TIPS.length}</span></div><p>${t.text}</p>
   <div class="btns"><button data-act="tutSkip">Skip tutorial</button><button class="primary" data-act="tutOk" data-arg="${t.k}">Got it</button></div></div>`;
}
let ARM=null; // two-tap confirmation for abandoning
const COMBAT_ACTS=['speed','skip','combatDone','toggleSfx','toggleMusic','settings','setOpt','closeSettings','tutOk','tutSkip'];
document.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;if(!ACT[a])return;
  if(SCREEN==='combat'&&!COMBAT_ACTS.includes(a))return;
  if(ARM&&a!=='abandon'&&a!=='abandonSaved')ARM=null;
  if(a==='skip'&&F.over)return;
  if(MERCHANT_TRANSITION){e.preventDefault();return}
  if(merchantCurtainAction(a,el.dataset.arg))return;
  const r=ACT[a](el.dataset.arg);
  if(r!=='norender'&&SCREEN!=='combat')render();
});
document.addEventListener('change',e=>{
  if(e.target.id!=='pswitch')return;const v=e.target.value;
  PROFILE_REMOVE_ARMED=null;
  if(v==='__new'){const k='p'+Date.now().toString(36);LP.list[k]={tag:'Player '+(Object.keys(LP.list).length+1),fav:HEROES[Math.floor(Math.random()*HEROES.length)].id,diff:'normal',stats:{}};LP.active=k;SCREEN='profile'}
  else if(LP.list[v])LP.active=v;
  loadActive();saveProfile();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#settings')){ACT.closeSettings();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[data-act]')){e.preventDefault();e.target.click()}});

}
try{window.claude?.hot?.snapshot?.(()=>S?{S:(({hero,...r})=>({...r,heroId:hero.id}))(S),UID,SCREEN}:{})}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
