<!doctype html>
<!-- Anime Bazaar balance stats (Claude 2026-11-14). Totals from anonymous run summaries on the friend-sync server
     (GET /stats, optional ?diff= and ?since=YYYY-MM-DD; the page also accepts ?since=). No player names or IDs exist on the server. Open it from the live site so item names load. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Bazaar Stats</title>
<style>
:root{--bg:#120f1a;--panel:#1d1828;--line:#33294a;--ink:#efe9ff;--dim:#a99dc4;--good:#7dff9a;--bad:#ff7a8a;--acc:#ffd23f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 8px;color:var(--acc)}
.sub{color:var(--dim);margin:0 0 14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}button.on{border-color:var(--acc);color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tile b{display:block;font-size:22px}.tile span{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}th,td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:normal;overflow-wrap:anywhere}
th{color:var(--dim);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}.pct{display:inline-block;min-width:0}
.meter{display:inline-block;height:6px;border-radius:3px;background:var(--line);width:60px;vertical-align:middle;margin-left:6px;overflow:hidden}.meter i{display:block;height:100%}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0}.err{color:var(--bad)}
@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:minmax(0,1fr)}.meter{display:none}}
</style></head><body><div class="wrap">
<h1>Anime Bazaar balance stats</h1>
<p class="sub">From anonymous summaries of finished runs (hero, difficulty, result, final board, fights). Small samples are hidden or marked.</p>
<div class="bar"><span id="diffs" class="bar" style="margin:0"></span><label class="hint" style="margin:0">Runs since <input type="date" id="since" style="background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit"></label></div>
<div id="out"><p class="sub">Loading…</p></div>
</div>
<script>
const SERVER=(new URLSearchParams(location.search).get('server')||'https://anime-bazaar-friends.butterfieldmax-091.workers.dev').replace(/\/+$/,'');
const MIN=5;let DIFF='',SINCE=new URLSearchParams(location.search).get('since')||'',NAMES={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?Math.round(100*a/b):0;
const meter=p=>`<span class="meter"><i style="width:${p}%;background:${p>=55?'var(--good)':p<=35?'var(--bad)':'var(--acc)'}"></i></span>`;
const nm=id=>NAMES[id]||id;
async function loadNames(){try{const h=await (await fetch('index.html',{cache:'no-store'})).text();
  for(const m of h.matchAll(/\b[IE]\('(?:[a-z0-9_]+',)?'([a-z0-9_]+)',(['"])((?:\\.|(?!\2).)*)\2/g))NAMES[m[1]]=m[3].replace(/\\'/g,"'");
  for(const m of h.matchAll(/\{id:'([a-z0-9_]+)',a:'[a-z0-9_]+',b:'[a-z0-9_]+',(?:loot:true,)?name:"([^"]+)"/g))NAMES[m[1]]=m[2];
  for(const m of h.matchAll(/\{id:'([a-z]+)',name:'([^']+)',short:/g))NAMES[m[1]]=m[2]}catch(e){}}
function table(rows,cols){return `<table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[2]||''}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</table>`}
function render(d){
  const R=d.runs||{runs:0,wins:0};
  if(!R.runs){document.getElementById('out').innerHTML=`<p class="sub">No finished runs reported${SINCE?' since '+esc(SINCE):''} yet. Stats appear once players on the current version finish runs.</p>`;return}
  const heroes=(d.heroes||[]).filter(h=>!DIFF||h.diff===DIFF);
  // The API reports each final-board item's total appearances and appearances
  // on winning runs. Derive the losing-board count instead of reusing the total.
  const itemTotals=(d.items||[]).map(i=>({...i,wins:Number(i.wins)||0,losses:Math.max(0,(Number(i.runs)||0)-(Number(i.wins)||0)),p:pct(i.wins,i.runs)}));
  const winningItems=itemTotals.filter(i=>i.wins>0);
  const losingItems=itemTotals.filter(i=>i.losses>0).map(i=>({...i,lossPct:pct(i.losses,i.runs)}));
  const itemLabel=i=>`${esc(nm(i.item))}${i.runs<MIN?' <span class="hint">(few runs)</span>':''}`;
  const foes=(d.foes||[]).filter(f=>f.fights>=MIN&&f.kind!=='pvp').map(f=>({...f,p:pct(f.won,f.fights)}));
  const pairs=(d.pairs||[]).map(x=>({...x,p:pct(x.wins,x.runs)}));
  const wr=r=>`<span class="pct">${pct(r.wins,r.runs)}%</span>${meter(pct(r.wins,r.runs))}`;
  document.getElementById('out').innerHTML=`
  <div class="tiles"><div class="tile"><span>Runs reported</span><b>${R.runs}</b></div><div class="tile"><span>Runs won</span><b>${pct(R.wins,R.runs)}%</b></div>
   <div class="tile"><span>Heroes played</span><b>${new Set(heroes.map(h=>h.hero)).size}</b></div><div class="tile"><span>Hidden pairs found</span><b>${pairs.length}</b></div></div>
  <div class="grid">
   <div class="card"><h2>Heroes</h2>${table(heroes.sort((a,b)=>b.runs-a.runs),[['Hero',h=>esc(nm(h.hero))+(h.runs<MIN?' <span class="hint">(few runs)</span>':'')],['Diff',h=>esc(h.diff)],['Runs',h=>h.runs,'n'],['Win rate',wr],['Avg day',h=>h.avgDay,'n'],['Avg wins',h=>h.avgWins,'n']])}</div>
   <div class="card"><h2>Hardest monsters, bosses and trials</h2>${table(foes.sort((a,b)=>a.p-b.p).slice(0,25),[['Foe',f=>esc(f.foe)],['Kind',f=>esc(f.kind)],['Fights',f=>f.fights,'n'],['Players won',f=>`<span class="pct">${f.p}%</span>${meter(f.p)}`]])}<p class="hint">Only foes fought ${MIN}+ times.</p></div>
   <div class="card"><h2>Items in winning boards</h2>${table(winningItems.sort((a,b)=>b.wins-a.wins||b.p-a.p).slice(0,25),[['Item',itemLabel],['Winning boards',i=>i.wins,'n'],['Run win rate',i=>`<span class="pct">${i.p}%</span>${meter(i.p)}`]])}<p class="hint">Items appearing on final boards of won runs. Samples under ${MIN} runs are marked.</p></div>
   <div class="card"><h2>Items in losing boards</h2>${table(losingItems.sort((a,b)=>b.losses-a.losses||b.lossPct-a.lossPct).slice(0,25),[['Item',itemLabel],['Losing boards',i=>i.losses,'n'],['Run loss rate',i=>`<span class="pct">${i.lossPct}%</span>`]])}<p class="hint">Items appearing on final boards of lost runs. Samples under ${MIN} runs are marked.</p></div>
   <div class="card"><h2>Most used items</h2>${table((d.items||[]).slice().sort((a,b)=>b.runs-a.runs).slice(0,25),[['Item',i=>esc(nm(i.item))],['Final boards',i=>i.runs,'n'],['Avg tier',i=>i.avgTier??'','n']])}</div>
   <div class="card"><h2>Hidden pairs players found</h2>${table(pairs.sort((a,b)=>b.runs-a.runs).slice(0,30),[['Pair',x=>esc(nm(x.pair))],['Runs',x=>x.runs,'n'],['Win rate',x=>`<span class="pct">${x.p}%</span>${meter(x.p)}`]])}</div>
   <div class="card"><h2>Day lost runs ended</h2>${table((d.endDays||[]).slice().sort((a,b)=>a.day-b.day),[['Day',x=>x.day,'n'],['Runs',x=>x.runs,'n']])}</div>
  </div>`}
async function load(){document.getElementById('diffs').innerHTML=[['','All'],['casual','Casual'],['normal','Normal'],['hard','Hard']].map(([v,l])=>`<button class="${DIFF===v?'on':''}" data-d="${v}">${l}</button>`).join('');
  try{const d=await (await fetch(SERVER+'/stats?'+new URLSearchParams({...(DIFF&&{diff:DIFF}),...(SINCE&&{since:SINCE})}),{cache:'no-store'})).json();render(d)}catch(e){document.getElementById('out').innerHTML='<p class="err">Could not reach the stats server.</p>'}}
document.getElementById('diffs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){DIFF=b.dataset.d;load()}});
const sinceBox=document.getElementById('since');sinceBox.value=SINCE;sinceBox.addEventListener('change',()=>{SINCE=sinceBox.value;load()});
loadNames().then(load);
</script></body></html>
